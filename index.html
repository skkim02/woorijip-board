<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>우리집 보드</title>

<!-- PWA / 홈화면 추가 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E07856">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리집">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FBF4E9; --card: #FFFFFF; --ink: #3A332B; --ink-soft: #998C7A;
    --line: #EEE4D3; --accent: #E07856; --accent-dark: #B85A3C;
    --need-bg: #FBE7D9; --need-fg: #B85A3C;
    --doing-bg: #DFEDEF; --doing-fg: #3F7A86;
    --done-bg: #E8EDE0; --done-fg: #6E7D5B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Gowun Dodum', sans-serif; display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 460px; padding: 22px 18px 60px; }

  header { margin-bottom: 22px; }
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .logo { font-family: 'Jua', sans-serif; font-size: 30px; color: var(--accent); margin: 0; letter-spacing: -0.5px; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 4px 0 0; }
  .invite-btn { flex-shrink: 0; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    font-family: inherit; font-size: 13px; padding: 8px 12px; border-radius: 11px; cursor: pointer; white-space: nowrap; }
  .invite-btn:active { transform: scale(.95); }

  .who { margin-top: 16px; background: #F2E7D5; border-radius: 14px; padding: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
  .who button { flex: 1 1 40%; border: none; background: transparent; font-family: inherit; font-size: 15px; color: var(--ink-soft); padding: 9px 0; border-radius: 11px; cursor: pointer; transition: all .15s; }
  .who button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.07); }

  .section-label { font-size: 14px; color: var(--ink-soft); margin: 26px 4px 10px; }
  .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
  .preset { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 13px 14px; font-family: inherit; font-size: 16px; color: var(--ink); text-align: left; cursor: pointer; transition: transform .08s, border-color .15s; display: flex; align-items: center; gap: 9px; }
  .preset:active { transform: scale(.96); }
  .preset:hover { border-color: var(--accent); }
  .preset .emo { font-size: 19px; }

  .custom-row { display: none; gap: 8px; margin-top: 9px; }
  .custom-row.show { display: flex; }
  .custom-row input { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; font-family: inherit; font-size: 16px; color: var(--ink); outline: none; }
  .custom-row input:focus { border-color: var(--accent); }
  .custom-row .add { border: none; background: var(--accent); color: #fff; border-radius: 14px; padding: 0 18px; font-family: inherit; font-size: 16px; cursor: pointer; }

  .board-head { display: flex; justify-content: space-between; align-items: center; margin: 30px 4px 12px; }
  .board-head .t { font-size: 16px; }
  .board-head .count { color: var(--accent); font-size: 14px; margin-left: 7px; }
  .refresh { border: none; background: transparent; cursor: pointer; color: var(--ink-soft); font-size: 17px; margin-left: 6px; padding: 2px 5px; }
  .refresh:active { transform: scale(.9); }

  .sort { display: flex; gap: 2px; background: #F2E7D5; border-radius: 10px; padding: 3px; }
  .sort button { border: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--ink-soft); padding: 6px 11px; border-radius: 8px; cursor: pointer; }
  .sort button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  /* 연결 상태 / 에러 안내 줄 */
  .status { display: none; font-size: 13px; color: var(--ink-soft); margin: 0 4px 12px; padding: 9px 13px; background: #F2E7D5; border-radius: 10px; }
  .status.err { background: #FBE2DE; color: #C0493C; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; animation: pop .2s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
  .card.done { opacity: .55; }
  .card .item { font-size: 17px; }
  .card.done .item { text-decoration: line-through; }
  .card .meta { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }

  .badge { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 8px; margin-left: 7px; vertical-align: 1px; }
  .badge.need { background: var(--need-bg); color: var(--need-fg); }
  .badge.doing { background: var(--doing-bg); color: var(--doing-fg); }
  .badge.done { background: var(--done-bg); color: var(--done-fg); }

  .deadline { display: inline-block; font-size: 12px; margin-top: 7px; padding: 3px 10px; border-radius: 8px; background: #F4E8D2; color: #9A7B3E; }
  .deadline.over { background: #FBE2DE; color: #C0493C; }

  .actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .btn { border: 1px solid var(--line); background: var(--card); font-family: inherit; font-size: 14px; color: var(--ink); padding: 8px 13px; border-radius: 11px; cursor: pointer; transition: transform .08s; }
  .btn:active { transform: scale(.95); }
  .btn.claim { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.done-btn { color: var(--doing-fg); border-color: var(--doing-bg); }
  .btn.icon { width: 34px; padding: 0; height: 34px; color: var(--ink-soft); font-size: 16px; line-height: 1; }

  .card.editing { align-items: stretch; }
  .edit-form { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .edit-form .edit-item { border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; font-family: inherit; font-size: 16px; color: var(--ink); outline: none; background: var(--card); }
  .edit-form .edit-item:focus { border-color: var(--accent); }
  .edit-line { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--ink-soft); }
  .edit-line input[type=date] { flex: 1; border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px; font-family: inherit; font-size: 15px; color: var(--ink); outline: none; background: var(--card); }
  .edit-line input[type=date]:focus { border-color: var(--accent); }
  .edit-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .hint { font-size: 12px; color: var(--ink-soft); }

  .empty { text-align: center; color: var(--ink-soft); padding: 36px 0; font-size: 15px; }

  /* 새 요청 팝업(토스트) */
  .toast-wrap { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 1000;
    width: calc(100% - 36px); max-width: 424px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { pointer-events: auto; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--accent);
    border-radius: 14px; box-shadow: 0 8px 24px rgba(58,51,43,.18); padding: 12px 14px;
    display: flex; align-items: center; gap: 11px; cursor: pointer; animation: toastIn .25s ease; }
  .toast .ic { font-size: 22px; line-height: 1; }
  .toast .tx { flex: 1; min-width: 0; }
  .toast .tt { font-family: 'Jua', sans-serif; font-size: 15px; color: var(--ink); }
  .toast .ds { font-size: 13px; color: var(--ink-soft); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast.out { animation: toastOut .25s ease forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }

  /* 푸시 알림 켜기 / 앱 설치 버튼 */
  .push-toggle, .install-btn { width: 100%; margin-top: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink-soft); font-family: inherit; font-size: 14px; padding: 10px 0; border-radius: 12px; cursor: pointer; transition: all .15s; }
  .push-toggle.on { background: var(--done-bg); color: var(--done-fg); border-color: transparent; }
  .install-btn { display: none; background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 공통 오버레이 (온보딩 / 초대 / iOS 안내) */
  .overlay { position: fixed; inset: 0; z-index: 2000; background: rgba(58,51,43,.45);
    display: none; align-items: center; justify-content: center; padding: 20px; }
  .overlay.show { display: flex; }
  .sheet { background: var(--bg); width: 100%; max-width: 420px; border-radius: 22px; padding: 26px 22px;
    box-shadow: 0 20px 60px rgba(58,51,43,.3); animation: toastIn .25s ease; max-height: 90vh; overflow-y: auto; }
  .sheet h2 { font-family: 'Jua', sans-serif; color: var(--accent); font-size: 24px; margin: 0 0 6px; }
  .sheet p.lead { color: var(--ink-soft); font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
  .sheet label { display: block; font-size: 13px; color: var(--ink-soft); margin: 14px 2px 6px; }
  .sheet input { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 13px;
    padding: 13px 14px; font-family: inherit; font-size: 16px; color: var(--ink); outline: none; }
  .sheet input:focus { border-color: var(--accent); }
  .sheet .big-btn { width: 100%; margin-top: 18px; border: none; background: var(--accent); color: #fff;
    font-family: inherit; font-size: 17px; padding: 14px 0; border-radius: 14px; cursor: pointer; }
  .sheet .big-btn:active { transform: scale(.98); }
  .sheet .ghost-btn { width: 100%; margin-top: 9px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink-soft); font-family: inherit; font-size: 15px; padding: 12px 0; border-radius: 14px; cursor: pointer; }
  .seg { display: flex; gap: 4px; background: #F2E7D5; border-radius: 13px; padding: 4px; margin-bottom: 4px; }
  .seg button { flex: 1; border: none; background: transparent; font-family: inherit; font-size: 15px;
    color: var(--ink-soft); padding: 10px 0; border-radius: 10px; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .code-box { text-align: center; background: var(--card); border: 1px dashed var(--accent); border-radius: 14px;
    padding: 16px; margin: 6px 0 4px; font-family: 'Jua', sans-serif; font-size: 30px; letter-spacing: 4px; color: var(--accent-dark); }
  .err-line { color: #C0493C; font-size: 13px; margin: 8px 2px 0; min-height: 16px; }
  .steps { margin: 4px 0 0; padding-left: 18px; color: var(--ink); font-size: 15px; line-height: 1.9; }
</style>
</head>
<body>
<div class="toast-wrap" id="toastWrap"></div>

<!-- ── 온보딩(그룹 만들기/참여) 오버레이 ── -->
<div class="overlay" id="onboarding">
  <div class="sheet">
    <h2>우리집 보드</h2>
    <p class="lead">함께 쓰는 사람들과 집안일·심부름을 버튼으로 부탁하고 끝내요.<br>그룹을 만들거나, 받은 코드로 참여하세요.</p>
    <div class="seg">
      <button id="segCreate" class="on">새로 만들기</button>
      <button id="segJoin">코드로 참여</button>
    </div>

    <div id="paneCreate">
      <label>그룹 이름 (예: 우리집, 김씨네)</label>
      <input id="createGroupName" type="text" placeholder="우리집" maxlength="20">
      <label>내 이름</label>
      <input id="createMyName" type="text" placeholder="예: 엄마" maxlength="12">
      <button class="big-btn" id="createBtn">그룹 만들기</button>
    </div>

    <div id="paneJoin" style="display:none">
      <label>그룹 코드 (6자리)</label>
      <input id="joinCode" type="text" placeholder="ABC123" maxlength="6" autocapitalize="characters" style="text-transform:uppercase">
      <label>내 이름</label>
      <input id="joinMyName" type="text" placeholder="예: 아빠" maxlength="12">
      <button class="big-btn" id="joinBtn">참여하기</button>
    </div>
    <div class="err-line" id="onboardErr"></div>
  </div>
</div>

<!-- ── 초대(코드 공유) 오버레이 ── -->
<div class="overlay" id="inviteOverlay">
  <div class="sheet">
    <h2>함께 쓰기</h2>
    <p class="lead">이 코드를 알려주면 같은 보드에서 함께 쓸 수 있어요.</p>
    <div class="code-box" id="inviteCode">------</div>
    <button class="big-btn" id="shareBtn">초대 링크 공유</button>
    <button class="ghost-btn" id="copyCodeBtn">코드 복사</button>
    <button class="ghost-btn" id="inviteCloseBtn">닫기</button>
  </div>
</div>

<!-- ── iOS 설치 안내 오버레이 ── -->
<div class="overlay" id="iosOverlay">
  <div class="sheet">
    <h2>홈 화면에 추가</h2>
    <p class="lead">아이폰에서는 Safari로 열고 아래처럼 홈 화면에 추가하면 앱처럼 쓰고 알림도 받을 수 있어요.</p>
    <ol class="steps">
      <li>하단의 <b>공유</b> 버튼 <span style="font-size:18px">􀈂</span> 누르기</li>
      <li><b>홈 화면에 추가</b> 선택</li>
      <li>오른쪽 위 <b>추가</b> 누르기</li>
    </ol>
    <button class="ghost-btn" id="iosCloseBtn" style="margin-top:18px">알겠어요</button>
  </div>
</div>

<div class="app">

  <header>
    <div class="top-row">
      <div>
        <h1 class="logo">우리집 보드</h1>
        <p class="sub" id="groupSub">버튼으로 부탁하고, 버튼으로 끝내요</p>
      </div>
      <button class="invite-btn" id="inviteBtn">＋ 초대</button>
    </div>
    <div class="who" id="who"></div>
    <button id="pushBtn" class="push-toggle">🔔 푸시 알림 켜기</button>
    <button id="installBtn" class="install-btn">📲 앱으로 설치하기</button>
  </header>

  <p class="section-label">자주 쓰는 요청 (누르면 보드에 올라가요)</p>
  <div class="presets">
    <button class="preset" data-item="우유"><span class="emo">🥛</span>우유</button>
    <button class="preset" data-item="빵"><span class="emo">🍞</span>빵</button>
    <button class="preset" data-item="계란"><span class="emo">🥚</span>계란</button>
    <button class="preset" data-item="휴지"><span class="emo">🧻</span>휴지</button>
    <button class="preset" data-item="쓰레기 버리기"><span class="emo">🗑️</span>쓰레기</button>
    <button class="preset" id="customToggle"><span class="emo">✏️</span>직접 입력</button>
  </div>
  <div class="custom-row" id="customRow">
    <input id="customInput" type="text" placeholder="무엇이 필요한가요?" maxlength="20">
    <button class="add" id="customAdd">추가</button>
  </div>

  <div class="board-head">
    <div>
      <span class="t">요청 목록</span><span class="count" id="count"></span>
      <button class="refresh" id="refreshBtn" aria-label="새로고침">↻</button>
    </div>
    <div class="sort">
      <button data-sort="time" class="on">요청순</button>
      <button data-sort="deadline">기한순</button>
    </div>
  </div>

  <div class="status" id="status"></div>
  <div id="board"></div>

</div>

<!-- Supabase 라이브러리 불러오기 (이게 먼저 로드돼야 함) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  /* =========================================================
     0) Supabase 연결 설정
        - 아래 두 값은 본인 프로젝트의 것. publishable 키는 공개용이라 코드에 둬도 됨.
     ========================================================= */
  const SUPABASE_URL = 'https://lxhcefdyalvbvxaanczh.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_O7KR_wRO43vb_MKaiPsNsQ_lIhwYyN0';

  // 위 라이브러리가 만든 전역 supabase 로 클라이언트(=데이터베이스 연결창구) 생성
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* =========================================================
     1) 그룹/사용자 상태
        - groupCode : 우리 그룹(방)을 구분하는 코드. 데이터는 이 코드로 격리된다.
        - members   : 이 그룹에 속한 사람 이름 목록 (DB의 groups 테이블과 동기화)
        - currentUser : 이 기기에서 '나'로 선택된 사람
     ========================================================= */
  let groupCode = localStorage.getItem('groupCode') || '';
  let groupName = localStorage.getItem('groupName') || '우리집';
  let members   = JSON.parse(localStorage.getItem('members') || '[]');
  let currentUser = localStorage.getItem('myName') || '';

  let requests = [];
  let editingId = null;
  let sortMode = 'time';
  let realtimeChannel = null;

  const board = document.getElementById('board');
  const countEl = document.getElementById('count');

  /* =========================================================
     2) Supabase 와 주고받는 동작들 (CRUD) — 모두 우리 그룹(groupCode) 범위로 한정
     ========================================================= */

  // R: 우리 그룹의 전체 목록 읽어오기
  async function loadRequests() {
    showStatus('불러오는 중…');
    const { data, error } = await db.from('requests').select('*').eq('group_code', groupCode);
    if (error) return showError(error);
    requests = data.map(fromRow);
    showStatus('');
    render();
  }

  // C: 새 부탁 올리기 (id, created_at 은 DB 가 자동으로 넣어줌)
  async function addRequest(item) {
    const { error } = await db.from('requests').insert({
      item: item, requester: currentUser, status: '필요해요', assignee: null, deadline: null,
      group_code: groupCode
    });
    if (error) return showError(error);
    await loadRequests();
  }

  // U: "내가 할게"
  async function claimRequest(id) {
    const { error } = await db.from('requests').update({ status: '내가 맡음', assignee: currentUser }).eq('id', id);
    if (error) return showError(error);
    await loadRequests();
  }

  // U: "완료" (처리한 사람을 assignee 에 기록 → 알림 받는 사람 판단에 사용)
  async function completeRequest(id) {
    const { error } = await db.from('requests').update({ status: '완료', assignee: currentUser }).eq('id', id);
    if (error) return showError(error);
    await loadRequests();
  }

  // U: 수정 (이름 + 기한) — 시작/취소는 화면만 바꾸고, 저장할 때만 DB 로 보냄
  function editRequest(id) { editingId = id; render(); }
  function cancelEdit()    { editingId = null; render(); }
  async function saveEdit(id) {
    const newItem = document.getElementById('editItem').value.trim();
    const newDate = document.getElementById('editDate').value;
    const patch = { deadline: newDate || null };
    if (newItem) patch.item = newItem;
    const { error } = await db.from('requests').update(patch).eq('id', id);
    if (error) return showError(error);
    editingId = null;
    await loadRequests();
  }

  // D: 지우기
  async function deleteRequest(id) {
    const { error } = await db.from('requests').delete().eq('id', id);
    if (error) return showError(error);
    await loadRequests();
  }

  // DB 한 줄(row)을 화면이 쓰는 모양으로 변환 (created_at → createdAt 등)
  function fromRow(row) {
    return {
      id: row.id, item: row.item, requester: row.requester,
      status: row.status, assignee: row.assignee,
      createdAt: new Date(row.created_at).getTime(),
      deadline: row.deadline
    };
  }

  /* =========================================================
     3) 화면 그리기
     ========================================================= */
  function render() {
    const active = sortActive(requests.filter(r => r.status !== '완료'));
    const done   = requests.filter(r => r.status === '완료').sort((a,b) => b.createdAt - a.createdAt);
    const ordered = [...active, ...done];

    countEl.textContent = active.length > 0 ? `지금 필요한 것 ${active.length}개` : '';

    if (ordered.length === 0) {
      board.innerHTML = '<div class="empty">아직 올라온 부탁이 없어요 🌿<br>위 버튼을 눌러보세요</div>';
      return;
    }
    board.innerHTML = ordered.map(r => (r.id === editingId ? editHTML(r) : cardHTML(r))).join('');
  }

  function sortActive(list) {
    if (sortMode === 'deadline') {
      return [...list].sort((a, b) => {
        if (a.deadline && b.deadline) return a.deadline < b.deadline ? -1 : 1;
        if (a.deadline) return -1;
        if (b.deadline) return 1;
        return b.createdAt - a.createdAt;
      });
    }
    return [...list].sort((a, b) => b.createdAt - a.createdAt);
  }

  function cardHTML(r) {
    let badge, meta, actionBtns;
    if (r.status === '필요해요') {
      badge = '<span class="badge need">필요해요</span>';
      meta = `${r.requester} · ${fmtDate(r.createdAt)} 요청`;
      actionBtns = `<button class="btn claim" onclick="claimRequest(${r.id})">내가 할게</button>`;
    } else if (r.status === '내가 맡음') {
      badge = '<span class="badge doing">내가 맡음</span>';
      meta = `${r.assignee}이(가) 가는 중 · ${fmtDate(r.createdAt)} 요청`;
      actionBtns = `<button class="btn done-btn" onclick="completeRequest(${r.id})">✓ 완료</button>`;
    } else {
      badge = '<span class="badge done">완료</span>';
      meta = `${r.assignee || r.requester}이(가) 처리함 · ${fmtDate(r.createdAt)} 요청`;
      actionBtns = '';
    }
    const editBtn = r.status !== '완료'
      ? `<button class="btn icon" onclick="editRequest(${r.id})" aria-label="수정">✎</button>` : '';
    return `
      <div class="card ${r.status === '완료' ? 'done' : ''}">
        <div>
          <span class="item">${r.item}</span>${badge}
          <div class="meta">${meta}</div>
          ${deadlineChip(r)}
        </div>
        <div class="actions">
          ${actionBtns}${editBtn}
          <button class="btn icon" onclick="deleteRequest(${r.id})" aria-label="지우기">×</button>
        </div>
      </div>`;
  }

  function editHTML(r) {
    return `
      <div class="card editing">
        <div class="edit-form">
          <input class="edit-item" id="editItem" value="${r.item}" maxlength="20">
          <div class="edit-line">
            <span>기한</span>
            <input type="date" id="editDate" value="${r.deadline || ''}">
          </div>
          <div class="hint">기한을 비우면 ‘기한 없음’ 으로 저장돼요</div>
          <div class="edit-actions">
            <button class="btn" onclick="cancelEdit()">취소</button>
            <button class="btn claim" onclick="saveEdit(${r.id})">저장</button>
          </div>
        </div>
      </div>`;
  }

  function deadlineChip(r) {
    if (!r.deadline) return '';
    const today = new Date().toISOString().slice(0, 10);
    const over = r.deadline < today && r.status !== '완료';
    return `<div class="deadline ${over ? 'over' : ''}">⏰ ${fmtDeadline(r.deadline)}까지${over ? ' (지남)' : ''}</div>`;
  }

  function fmtDate(t) { const d = new Date(t); return `${d.getMonth() + 1}월 ${d.getDate()}일`; }
  function fmtDeadline(ds) { const d = new Date(ds + 'T00:00'); return `${d.getMonth() + 1}월 ${d.getDate()}일`; }

  // 연결 상태 / 에러를 화면 위에 보여주기
  function showStatus(msg) {
    const el = document.getElementById('status');
    el.textContent = msg || '';
    el.className = 'status';
    el.style.display = msg ? 'block' : 'none';
  }
  function showError(error) {
    const el = document.getElementById('status');
    el.textContent = '연결 문제: ' + (error.message || error) + '  (표 이름·정책 설정을 확인해보세요)';
    el.className = 'status err';
    el.style.display = 'block';
    console.error(error);
  }

  /* =========================================================
     4) 멤버(누구) 바 그리기 — 그룹 멤버 목록으로 동적 생성
     ========================================================= */
  function renderWho() {
    const el = document.getElementById('who');
    el.innerHTML = members.map(m =>
      `<button data-user="${m}" class="${m === currentUser ? 'on' : ''}">🙋 ${m}</button>`
    ).join('');
    el.querySelectorAll('button').forEach(b => {
      b.onclick = () => {
        currentUser = b.dataset.user;
        localStorage.setItem('myName', currentUser);
        renderWho();
        resaveSubscriptionIfAny();   // 내가 누구인지 바뀌면 푸시 받는 사람도 갱신
      };
    });
  }

  function refreshGroupHeader() {
    document.getElementById('groupSub').textContent = `${groupName} · 버튼으로 부탁하고, 버튼으로 끝내요`;
  }

  /* =========================================================
     5) 그룹 만들기 / 참여 (온보딩)
     ========================================================= */
  function genCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 헷갈리는 0/O/1/I 제외
    let c = '';
    for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
    return c;
  }

  function persistGroup() {
    localStorage.setItem('groupCode', groupCode);
    localStorage.setItem('groupName', groupName);
    localStorage.setItem('members', JSON.stringify(members));
    localStorage.setItem('myName', currentUser);
  }

  async function createGroup(name, myName) {
    name = (name || '우리집').trim() || '우리집';
    myName = (myName || '').trim();
    if (!myName) throw new Error('내 이름을 입력해 주세요.');
    // 코드 중복을 피하려고 몇 번 시도
    let code = '';
    for (let i = 0; i < 5; i++) {
      code = genCode();
      const { data } = await db.from('groups').select('code').eq('code', code).maybeSingle();
      if (!data) break;
    }
    const { error } = await db.from('groups').insert({ code, name, members: [myName] });
    if (error) throw error;
    groupCode = code; groupName = name; members = [myName]; currentUser = myName;
    persistGroup();
  }

  async function joinGroup(code, myName) {
    code = (code || '').trim().toUpperCase();
    myName = (myName || '').trim();
    if (code.length !== 6) throw new Error('6자리 코드를 정확히 입력해 주세요.');
    if (!myName) throw new Error('내 이름을 입력해 주세요.');
    const { data: g, error } = await db.from('groups').select('*').eq('code', code).maybeSingle();
    if (error) throw error;
    if (!g) throw new Error('그 코드의 그룹을 찾을 수 없어요.');
    const mem = Array.isArray(g.members) ? g.members.slice() : [];
    if (!mem.includes(myName)) {
      mem.push(myName);
      const { error: upErr } = await db.from('groups').update({ members: mem }).eq('code', code);
      if (upErr) throw upErr;
    }
    groupCode = code; groupName = g.name || '우리집'; members = mem; currentUser = myName;
    persistGroup();
  }

  // 온보딩 화면 동작
  function setupOnboarding() {
    const overlay = document.getElementById('onboarding');
    const segCreate = document.getElementById('segCreate');
    const segJoin = document.getElementById('segJoin');
    const paneCreate = document.getElementById('paneCreate');
    const paneJoin = document.getElementById('paneJoin');
    const err = document.getElementById('onboardErr');

    segCreate.onclick = () => { segCreate.classList.add('on'); segJoin.classList.remove('on'); paneCreate.style.display = 'block'; paneJoin.style.display = 'none'; err.textContent = ''; };
    segJoin.onclick   = () => { segJoin.classList.add('on'); segCreate.classList.remove('on'); paneJoin.style.display = 'block'; paneCreate.style.display = 'none'; err.textContent = ''; };

    // 초대 링크(?join=코드)로 들어왔으면 참여 탭을 미리 열고 코드 채우기
    const joinParam = new URLSearchParams(location.search).get('join');
    if (joinParam) {
      segJoin.onclick();
      document.getElementById('joinCode').value = joinParam.toUpperCase();
    }

    document.getElementById('createBtn').onclick = async () => {
      err.textContent = '';
      try {
        await createGroup(document.getElementById('createGroupName').value, document.getElementById('createMyName').value);
        overlay.classList.remove('show');
        startApp();
      } catch (e) { err.textContent = e.message || String(e); }
    };
    document.getElementById('joinBtn').onclick = async () => {
      err.textContent = '';
      try {
        await joinGroup(document.getElementById('joinCode').value, document.getElementById('joinMyName').value);
        overlay.classList.remove('show');
        startApp();
      } catch (e) { err.textContent = e.message || String(e); }
    };

    overlay.classList.add('show');
  }

  /* =========================================================
     6) 초대(코드 공유)
     ========================================================= */
  function inviteLink() {
    return location.origin + location.pathname + '?join=' + groupCode;
  }
  function setupInvite() {
    const overlay = document.getElementById('inviteOverlay');
    document.getElementById('inviteBtn').onclick = () => {
      document.getElementById('inviteCode').textContent = groupCode;
      overlay.classList.add('show');
    };
    document.getElementById('inviteCloseBtn').onclick = () => overlay.classList.remove('show');
    document.getElementById('shareBtn').onclick = async () => {
      const text = `'${groupName}' 보드에 초대합니다. 코드: ${groupCode}`;
      if (navigator.share) {
        try { await navigator.share({ title: '우리집 보드 초대', text, url: inviteLink() }); } catch (e) {}
      } else {
        await copyText(inviteLink());
        showToast('링크 복사됨', '붙여넣기 해서 공유하세요');
      }
    };
    document.getElementById('copyCodeBtn').onclick = async () => {
      await copyText(groupCode);
      showToast('코드 복사됨', groupCode);
    };
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
      ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove();
    }
  }

  /* =========================================================
     7) 앱 설치 (PWA) — 안드로이드/PC 는 버튼, iOS 는 안내
     ========================================================= */
  let deferredInstallPrompt = null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  function setupInstall() {
    const btn = document.getElementById('installBtn');
    if (isStandalone) { btn.style.display = 'none'; return; }   // 이미 설치해서 앱으로 열림

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      btn.style.display = 'block';
    });
    window.addEventListener('appinstalled', () => { btn.style.display = 'none'; });

    if (isIOS) btn.style.display = 'block';   // iOS 는 prompt 가 없으니 안내용으로 항상 노출

    btn.onclick = async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        btn.style.display = 'none';
      } else if (isIOS) {
        document.getElementById('iosOverlay').classList.add('show');
      } else {
        showToast('설치 안내', '브라우저 메뉴에서 "앱 설치 / 홈 화면에 추가"를 선택하세요');
      }
    };
    document.getElementById('iosCloseBtn').onclick = () => document.getElementById('iosOverlay').classList.remove('show');
  }

  /* =========================================================
     8) 화면 위 알림 (앱이 열려있을 때: 팝업 + 소리 + 시스템 알림)
     ========================================================= */
  let notifyAsked = false;
  let audioCtx = null;

  function ensureNotifyPermission() {
    if (notifyAsked) return;
    notifyAsked = true;
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }
  }

  function playDing() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(880, audioCtx.currentTime);
      o.frequency.setValueAtTime(1320, audioCtx.currentTime + 0.12);
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
      o.start();
      o.stop(audioCtx.currentTime + 0.37);
    } catch (e) {}
  }

  function showToast(title, desc) {
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<span class="ic">🔔</span><div class="tx"><div class="tt">${title}</div><div class="ds">${desc}</div></div>`;
    const remove = () => { el.classList.add('out'); setTimeout(() => el.remove(), 250); };
    el.onclick = remove;
    wrap.appendChild(el);
    setTimeout(remove, 5000);
  }

  function notify(title, desc, tag) {
    showToast(title, desc);
    playDing();
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification(title, { body: desc, icon: 'icons/icon-192.png', tag }); } catch (e) {}
    }
  }

  function notifyNewRequest(r) {
    const who = r.requester || '누군가';
    notify(`${who}님의 새 요청`, `${r.item} — 보드에 올라왔어요`, 'request-' + r.id);
  }

  ['click', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, function once() {
      ensureNotifyPermission();
      try { (audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)()).resume(); } catch (e) {}
      document.removeEventListener(ev, once);
    }, { passive: true })
  );

  /* =========================================================
     9) 본격 푸시 (앱을 닫아도 알림) — 서비스워커 + Web Push
        구독 정보를 push_subscriptions 에 (우리 그룹 코드와 함께) 저장한다.
     ========================================================= */
  const PUSH_PUBLIC_KEY = 'BOXhnrggGfxOEj9tlmVfSUzertlcxQ3swW-HOqKAW-qh8aWvwCRR4kaHRV0mcc3KOpeZk7gklDaSQxik5hn_C9g';

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
  }

  const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window;

  async function saveSubscription(sub) {
    const j = sub.toJSON();
    await db.from('push_subscriptions').upsert({
      endpoint: sub.endpoint,
      member: currentUser,
      group_code: groupCode,
      p256dh: j.keys.p256dh,
      auth: j.keys.auth,
      updated_at: new Date().toISOString()
    }, { onConflict: 'endpoint' });
  }

  async function enablePush() {
    if (!pushSupported) {
      alert('이 브라우저는 푸시를 지원하지 않아요.\niPhone은 Safari에서 "홈 화면에 추가"한 앱으로 열어주세요.');
      return;
    }
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { alert('알림 권한이 필요해요. 설정에서 허용해 주세요.'); return; }
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(PUSH_PUBLIC_KEY)
        });
      }
      await saveSubscription(sub);
      await refreshPushButton();
      showToast('푸시 알림 켜짐', '이제 앱을 닫아도 새 요청 알림이 와요');
    } catch (e) {
      console.error(e);
      alert('푸시 설정 중 문제가 생겼어요: ' + (e.message || e));
    }
  }

  async function refreshPushButton() {
    const btn = document.getElementById('pushBtn');
    if (!pushSupported) { btn.style.display = 'none'; return; }
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if (sub && Notification.permission === 'granted') {
      btn.textContent = '🔔 푸시 알림 켜짐'; btn.classList.add('on');
    } else {
      btn.textContent = '🔔 푸시 알림 켜기'; btn.classList.remove('on');
    }
  }

  async function resaveSubscriptionIfAny() {
    if (!pushSupported || !groupCode) return;
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if (sub) await saveSubscription(sub);
  }

  /* =========================================================
     10) 정적 버튼 연결 (그룹과 무관하게 한 번만)
     ========================================================= */
  document.querySelectorAll('.preset[data-item]').forEach(b => {
    b.onclick = () => addRequest(b.dataset.item);
  });
  document.querySelectorAll('.sort button').forEach(b => {
    b.onclick = () => {
      sortMode = b.dataset.sort;
      document.querySelectorAll('.sort button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      render();
    };
  });
  document.getElementById('refreshBtn').onclick = loadRequests;

  const customRow = document.getElementById('customRow');
  document.getElementById('customToggle').onclick = () => {
    customRow.classList.toggle('show');
    if (customRow.classList.contains('show')) document.getElementById('customInput').focus();
  };
  function addCustom() {
    const input = document.getElementById('customInput');
    const v = input.value.trim();
    if (v) { addRequest(v); input.value = ''; customRow.classList.remove('show'); }
  }
  document.getElementById('customAdd').onclick = addCustom;
  document.getElementById('customInput').addEventListener('keydown', e => { if (e.key === 'Enter') addCustom(); });

  document.getElementById('pushBtn').onclick = enablePush;

  /* =========================================================
     11) 앱 시작 — 그룹이 정해진 뒤 실제 보드를 띄운다
     ========================================================= */
  function startApp() {
    refreshGroupHeader();
    renderWho();

    if (pushSupported) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
      refreshPushButton();
      resaveSubscriptionIfAny();
    } else {
      document.getElementById('pushBtn').style.display = 'none';
    }

    loadRequests();

    // 실시간 구독: 우리 그룹의 requests 가 바뀌면 자동으로 다시 불러온다.
    if (realtimeChannel) db.removeChannel(realtimeChannel);
    realtimeChannel = db.channel('requests-' + groupCode)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'requests', filter: `group_code=eq.${groupCode}` },
        (payload) => {
          const r = payload.new;
          if (payload.eventType === 'INSERT') {
            if (r && r.requester !== currentUser) notifyNewRequest(r);
          } else if (payload.eventType === 'UPDATE' && r) {
            const prev = requests.find(x => x.id === r.id);
            if (prev && prev.status !== r.status && r.assignee !== currentUser) {
              if (r.status === '내가 맡음') notify(`${r.assignee}님이 맡았어요`, `${r.item}`, 'status-' + r.id);
              else if (r.status === '완료')  notify(`${r.assignee}님이 완료했어요`, `${r.item}`, 'status-' + r.id);
            }
          }
          loadRequests();
        })
      .subscribe();
  }

  /* =========================================================
     12) 부팅 — 그룹이 있으면 바로 시작, 없으면 온보딩
        (기존 와이프/남편 사용자는 'default' 그룹으로 자연 이전)
     ========================================================= */
  setupInvite();
  setupInstall();

  (function boot() {
    // 기존 사용자 자동 이전: groupCode 가 없는데 예전 'whoami' 가 있으면 default 그룹으로
    if (!groupCode) {
      const legacyWho = localStorage.getItem('whoami');
      if (legacyWho) {
        groupCode = 'default'; groupName = '우리집';
        members = ['와이프', '남편'];
        if (!members.includes(legacyWho)) members.push(legacyWho);
        currentUser = legacyWho;
        persistGroup();
      }
    }

    if (groupCode) {
      if (!currentUser && members.length) currentUser = members[0];
      startApp();
    } else {
      setupOnboarding();
    }
  })();
</script>
</body>
</html>
